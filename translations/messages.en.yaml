projekt_intranet:
    title: 'Internal Intranet Portal: Case Study'
    back: '← Back to projects'
    label: 'Case Study'
    heading: 'Track manufacturing progress. Handle retries safely.'
    intro: 'The manufacturing module manages projects, drawing revisions and individual pipe spools, which are prefabricated pipe assemblies. ERP project data enriches the view. Stage bookings and history are stored in the intranet database.'
    techstack_heading: 'Tech stack'
    tech_backend: '<strong>Backend:</strong> PHP 8.2+, Symfony 7.4 (Security, Messenger, Scheduler, Notifier, LDAP, Mailer)'
    tech_frontend: '<strong>Frontend:</strong> Twig, Tailwind CSS, Symfony UX / Stimulus, Turbo and Chart.js'
    tech_data: '<strong>Data access:</strong> Doctrine DBAL, SQL Server and separate connections for ERP and intranet data'
    tech_auth: '<strong>Access:</strong> Web-server/LDAP authentication, a mobile API with Entra bearer tokens and role-based permissions'
    tech_async: '<strong>Async:</strong> Symfony Messenger + Redis + Scheduler'
    tech_docs: '<strong>Documents:</strong> mPDF, TCPDF, FPDI, Browsershot (PDF); PhpSpreadsheet (Excel)'
    challenges_heading: 'Challenges & solutions'
    challenge1_title: '1. Read ERP data, write manufacturing data'
    challenge1_text: 'Project information is read from the ERP. The manufacturing module uses Doctrine DBAL to write new stage bookings into its own tables. These different responsibilities use separate database connections.'
    challenge2_title: '2. Check permissions and drawing revisions'
    challenge2_text: 'A mobile booking requires write access and permission for the selected manufacturing stage. The API rejects new bookings for spools that no longer belong to the active revision.'
    challenge3_title: '3. Long-running tasks do not block the UI'
    challenge3_text: 'Large Excel exports, printer status queries, automatic warning emails and cleanup jobs run asynchronously via Symfony Messenger (Redis) and are partly scheduled via the Scheduler. The interface stays responsive.'
    challenge4_title: '3. Backfilled entries must not move progress backwards'
    challenge4_text: 'The current status uses the highest booked manufacturing stage since the last reset. Recording an earlier stage afterwards does not move progress backwards. Cancelled bookings remain in the history but no longer count towards the active status.'
    revision_title: '4. Preserve a piece’s identity across revisions'
    revision_text: 'Unaffected pieces can be carried from a superseded drawing revision into the active revision. Their original ID remains, preserving the references used by status history, QR labels and packaging. Checks prevent replacing target positions that already have current status or active packaging.'
    role_heading: 'My role'
    role_text: 'My contribution covers architecture, the Symfony backend, Twig frontend, database integration and server operations. It also involves translating business requirements into maintainable modules.'
    result_heading: 'Result'
    result_text: 'Project views, status history and progress calculations use shared manufacturing data and status rules. This connects recording work on the shop floor with a traceable overview in the intranet.'

