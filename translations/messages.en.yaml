intranet_absence:
    title: 'Trainee absence reporting: Intranet case study'
    label: 'Intranet / Trainee absences'
    heading: 'Putting trainee absences in context.'
    intro: 'The module turns existing absence records into a searchable trainee overview. A detail view shows monthly values, yearly totals and a cumulative trend. The training period and calculated net working days provide context for the figures.'
    problem_title: 'A total does not explain the pattern'
    problem_text: 'A total alone shows neither when absences were recorded nor which part of the training period it describes. A useful report needs detail over time.'
    decision_title: 'Connect month, year and period'
    decision_text: 'Records are aggregated by year and month. A detail view complements the overview with monthly values and a cumulative chart within the training period.'
    result_title: 'From overview to the underlying trend'
    result_text: 'Selecting a profile opens monthly values, yearly totals and the trend. The overall count can be understood through its individual time periods.'
    detail1_title: '1. Search and load the details'
    detail1_text: 'Search filters the trainee overview. Selecting an entry loads its JSON data and opens a detail view without rebuilding the entire page.'
    detail2_title: '2. The period is part of the figure'
    detail2_text: 'Months outside the training period show a dash; months within it can show zero recorded absence days. The overview ratio uses the elapsed period to today, while the detail figure uses the full training period. These different reference periods matter when reading the figures.'
    detail3_title: '3. Accumulate monthly values'
    detail3_text: 'The backend sums absence days by month, year and overall. Chart.js builds the cumulative trend from chronologically sorted year-month keys. A month without new absence days leaves the cumulative count unchanged.'
    tech: 'Symfony · Doctrine DBAL · SQL Server · Twig · Stimulus · Chart.js'
    example_profile: 'Example profile A'
    example_period: 'August to October'
    total_days: 'recorded absence days'
    monthly: 'Monthly absence days'
    cumulative: 'Cumulative'
    month_values: 'Monthly and cumulative absence days'
    august: 'Aug'
    september: 'Sep'
    october: 'Oct'
    month_days: 'Days: %days%'
    running_total: 'Cumulative: %days%'
    zero_note: 'September adds no absence days. The cumulative count stays at two days.'
    caption: 'Schematic illustration with fictional monthly counts of absence days. All three example months fall within the training period. No real personnel records.'

intranet_labels:
    title: 'Label generator: Intranet case study'
    label: 'Intranet / Labels'
    heading: 'Turning spreadsheet data into labels.'
    intro: 'The label generator combines saved layouts with Excel data. Dynamic text fields take their values from mapped columns. It produces PDF pages in label format, with QR content derived from the same fields when the layout includes a QR component.'
    problem_title: 'The same layout, changing content'
    problem_text: 'Project and position data change from row to row. The label layout needs to remain reusable without preparing every label individually.'
    decision_title: 'Keep layout and data separate'
    decision_text: 'The template stores components, positions and column mappings. Generation inserts the Excel values into that structure.'
    result_title: 'A series of PDF labels'
    result_text: 'Processed rows become individual label pages. When configured grouping values change in the data sequence, the generator starts a new PDF file.'
    detail1_title: '1. Fields instead of fixed content'
    detail1_text: 'The graphical designer maps dynamic text fields to Excel columns. The generator converts column letters into indices and reads values from the current data row. The saved layout remains separate.'
    detail2_title: '2. From the editor to PDF format'
    detail2_text: 'Component positions and sizes are converted into millimeters for output. Text, shapes, rotations, logos and QR components have separate PDF rendering paths. Each processed data row creates one page in label format.'
    detail3_title: '3. Split files along the data sequence'
    detail3_text: 'Up to three configured Excel columns determine file boundaries. When their values change as the rows are processed, a new PDF file begins. The order of the input data is significant.'
    tech: 'Symfony · Doctrine DBAL · Twig · Stimulus · Konva · PhpSpreadsheet · TCPDF'
    mapping_heading: 'Excel columns → Template fields'
    project: 'Project'
    position: 'Position'
    description: 'Description'
    part: 'Part A'
    mapping_note: 'The template defines the layout. The data row supplies the content.'
    pdf_format: 'PDF · Label format'
    page_note: 'One label page per data row.'
    caption: 'Schematic illustration with fictional fields and values. No real labels or customer data. The output consists of PDF pages in label format.'

intranet_printers:
    title: 'Printer management: Intranet case study'
    label: 'Intranet / Printers'
    heading: 'Bringing printer readings and maintenance together.'
    intro: 'The printer module connects stored toner levels and page counters with maintenance records. Scheduled device queries supply new readings. A searchable overview and a date-filtered history make these values accessible.'
    problem_title: 'A reading shows one moment in time'
    problem_text: 'The current page counter does not explain how usage has developed. Supporting the devices needs earlier readings and the associated maintenance records.'
    decision_title: 'Separate collection from display'
    decision_text: 'Scheduled background tasks read device values through SNMP. Usable page counters are stored and appended to a history; the interface reads the saved data.'
    result_title: 'Readings and history in one place'
    result_text: 'The overview connects device readings with maintenance information. A date filter narrows the counter history, while documented work remains separately traceable.'
    detail1_title: '1. Query devices in the background'
    detail1_text: 'Symfony Scheduler initiates device queries; a Messenger handler reads SNMP values and writes them to the database. The web interface uses these saved readings, showing the data collected by scheduled queries.'
    detail2_title: '2. Do not turn unknown counters into zero'
    detail2_text: 'Devices can return unusable responses as well as numbers. Processing checks page counters for numeric, nonnegative values. Unknown or invalid counters are not appended to the history as new readings.'
    detail3_title: '3. Distinguish the counter from its change'
    detail3_text: 'SQL groups the saved values by day using the highest counter reading. The interface can show differences between available samples. When readings are missing, a difference covers the interval between those samples rather than necessarily one calendar day.'
    tech: 'Symfony · Scheduler · Messenger · SNMP · Doctrine DBAL · SQL Server · Stimulus · Chart.js'
    example_device: 'Example printer A'
    counter: 'page counter'
    toner: 'Toner level'
    stored_readings: 'Stored daily readings · Page counter'
    day1: '21 Oct'
    day2: '22 Oct'
    day3: '23 Oct'
    maintenance: 'Maintenance record'
    maintenance_entry: 'Rollers cleaned'
    maintenance_note: 'Documented work complements the automatically collected device readings.'
    history: 'History'
    caption: 'Schematic illustration with fictional readings and a maintenance entry. It shows stored page counters, not a live device query. No real device or network data.'

intranet_vehicles:
    title: 'Vehicle management: Intranet case study'
    label: 'Intranet / Vehicles'
    heading: 'Bringing vehicle data and maintenance together.'
    intro: 'Vehicle management connects master data with a chronological maintenance history and UVV and WOLKE records. The detail view adds a roadworthiness inspection date (HU) from an existing Excel fleet list. PDF exports turn recorded work into documents.'
    problem_title: 'Vehicle information spans several sources'
    problem_text: 'Master data and maintenance work belong to the vehicle, while its HU date is maintained in an existing Excel list. A shared view needs to bring these sources together.'
    decision_title: 'Connect through the vehicle ID'
    decision_text: 'The detail view loads the vehicle and its maintenance history from the database. It adds the HU date from the matching vehicle ID in the Excel list.'
    result_title: 'A traceable vehicle record'
    result_text: 'Recorded work appears in chronological order. UVV and WOLKE entries remain accessible; the history and individual inspection records can be exported as PDFs.'
    detail1_title: '1. Include existing spreadsheet data'
    detail1_text: 'PhpSpreadsheet reads the existing fleet list. The vehicle ID identifies the matching row, from which the HU date is read. The interface combines this value with the application data.'
    detail2_title: '2. Record work and inspection types together'
    detail2_text: 'A maintenance entry describes the work and can be marked as UVV or WOLKE. The history is ordered by its recorded timestamp. The latest UVV and WOLKE summaries use the most recent matching records.'
    detail3_title: '3. Turn records into documents'
    detail3_text: 'PDF exports present the maintenance history of a vehicle and individual inspection entries. The documents use saved details together with the associated vehicle data.'
    tech: 'Symfony · Doctrine DBAL · SQL Server · Twig · Stimulus · PhpSpreadsheet · TCPDF'
    example_vehicle: 'Example vehicle'
    record: 'Vehicle record'
    history: 'Maintenance history'
    service: 'Maintenance'
    wolke: 'WOLKE record'
    uvv: 'UVV record'
