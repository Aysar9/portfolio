    tech_backend: '<strong>Backend:</strong> PHP 8.3, Symfony 7, Doctrine ORM'
    tech_data: '<strong>Database:</strong> MySQL 8'
    tech_infra: '<strong>Infrastructure:</strong> Docker &amp; Docker Compose (Nginx, PHP-FPM, MySQL as separate containers)'
    tech_tests: '<strong>Tests:</strong> PHPUnit, unit and functional tests (15 tests)'
    challenges_heading: 'Challenges & solutions'
    challenge1_title: '1. Enforcing valid status transitions'
    challenge1_text: 'An application must not jump from any status to any other (e.g. not directly from "applied" to "accepted"). The transition logic lives as its own business rule in the domain code rather than scattered across the controller, with a dedicated PATCH endpoint for status changes.'
    challenge2_title: '2. Clean REST design instead of raw CRUD endpoints'
    challenge2_text: 'Endpoints return consistent HTTP status codes (200, 201, 204, 404, 422) and structured validation errors, so a client can reliably distinguish "invalid input" from "not found".'
    challenge3_title: '3. Test-driven from the start'
    challenge3_text: '15 tests cover both the status logic at the unit level and the HTTP endpoints functionally. I used this project to practise writing tests alongside functionality instead of afterwards.'
    challenge4_title: '4. A reproducible environment with Docker'
    challenge4_text: 'Nginx, PHP-FPM and MySQL run as separate containers via Docker Compose. A single "docker compose up -d --build" plus migrations is enough to run the application identically anywhere.'
    role_heading: 'My role'
    role_text: 'Sole developer: API design, domain logic, database modelling, tests and the Docker setup are entirely my work. I built it to practise backend development and DevOps.'
    result_heading: 'Result'
    result_text: 'A working, fully containerised REST API with a clean status lifecycle, consistent HTTP responses and 15 passing tests. A compact demonstration of API design, testing discipline and Docker knowledge.'
    repo_link: 'View the code on GitHub'

projekt_aitext:
    title: 'AI Text Summarizer: Case Study'
    back: '← Back to projects'
    label: 'Case Study'
    heading: 'A first hands-on AI agent in PHP, built on Symfony AI'
    intro: 'A small Symfony application built to get hands-on with Symfony''s brand-new official AI component: an agent that summarises any text into three sentences using the OpenAI API (gpt-4o-mini). Built as companion code for a German-language tutorial I recorded. It is a compact, honest demo rather than a production app, with the new AgentInterface wired up end to end.'
    techstack_heading: 'Tech stack'
    tech_backend: '<strong>Backend:</strong> PHP 8.4, Symfony 8.1'
    tech_ai: '<strong>AI:</strong> Symfony AI Bundle v0.11.0 (ai-bundle, ai-agent, ai-open-ai-platform) with OpenAI gpt-4o-mini'
    tech_frontend: '<strong>Frontend:</strong> Twig, Symfony UX Turbo'
    challenges_heading: 'Challenges & solutions'
    challenge1_title: '1. Symfony AI is a toolbox of 70+ packages, not one'
    challenge1_text: 'The ai-bundle alone isn''t enough. It needs the ai-agent component (Agent, MessageBag) and a separate provider bridge (here: ai-open-ai-platform) installed on top. The upside: swapping providers later (Anthropic, Gemini, a local Ollama model) means swapping the bridge package, not rewriting the application code.'
    challenge2_title: '2. Turbo silently swallows the response'
    challenge2_text: 'The Symfony webapp skeleton ships with Symfony UX Turbo, which expects a redirect after a form POST. Without data-turbo="false" on the &lt;form&gt;, the server responds correctly but nothing renders in the browser. This reminded me to check the network tab, not just server logs, when the UI "does nothing".'
    role_heading: 'My role'
    role_text: 'Solo build, done to learn Symfony''s new AI integration layer hands-on before using it in a real project. It is companion code to a German YouTube tutorial I recorded. Production concerns (form validation, CSRF, error handling, streaming) were deliberately left out, since they weren''t the point of the exercise.'
    result_heading: 'Result'
    result_text: 'A minimal, working AI agent connecting the form, Agent, OpenAI and Twig, plus two documented gotchas for the next person (and my future self) building with Symfony AI.'
    repo_link: 'View the code on GitHub'

