intranet_capacity:
    title: 'Capacity planning: Intranet case study'
    label: 'Intranet / Capacity planning'
    heading: 'Project hours need a point of comparison.'
    intro: 'Capacity planning compares planned project hours with available hours for each work group and calendar week. Calendar rules and capacity assignments valid for that week feed the calculation. The web view and Excel export use the same calculation service.'
    problem_title: 'Hours alone do not show utilization'
    problem_text: 'The same planned hours can mean different things in two different weeks. Available working time and calendar rules change the basis for comparison.'
    decision_title: 'Calculate per group and week'
    decision_text: 'Planned demand and available capacity are calculated together. When no capacity basis has been configured, that remains visible as a separate state.'
    result_title: 'Missing input stays visible'
    result_text: 'The overview shows the relationship between planned work and capacity. Missing input is not presented as overload. The web view and export use the same rules.'
    detail1_title: '1. Account for the calendar'
    detail1_text: 'Weekly capacity considers working hours, headcount, a configured absence factor, and day and bridge-day factors. It uses the capacity assignments valid for the relevant week.'
    detail2_title: '2. Unknown is a separate state'
    detail2_text: 'When every configured capacity is zero, the calculation returns no utilization class. The interface marks the missing basis in gray. Warning levels follow configured capacity thresholds, so 110 percent does not automatically imply a particular warning class.'
    detail3_title: '3. Share rules between the view and export'
    detail3_text: 'The weekly JSON endpoint and Excel export use the same capacity service. After a planning edit, the interface reloads the affected groups and weeks, with a full reload available as a fallback.'
    tech: 'Symfony · Doctrine DBAL · SQL Server · Stimulus · PhpSpreadsheet'
    example_title: 'Three example weeks for one work group'
    planned: 'Planned'
    available: 'Normal capacity'
    utilization: 'Utilization'
    not_configured: 'Not configured'
    unknown: 'Not calculable'
