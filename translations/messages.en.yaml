intranet_telephone:
    title: 'Phonebook & call history: Intranet case study'
    label: 'Intranet / Telephony'
    heading: 'Connecting the phonebook and phone system.'
    intro: 'The telephone module connects a shared phonebook with the phone system’s call history. It matches different number formats to contacts while keeping the original number, phonebook value and callback format separate.'
    problem_title: 'One number, several formats'
    problem_text: 'The phone system and phonebook represent the same number differently. A single transformed value does not serve display, contact matching and redial equally well.'
    decision_title: 'Each value has a purpose'
    decision_text: 'The original value is preserved. A dedicated matcher derives suitable phonebook and callback values, prioritizing precise matches over legacy mapping rules.'
    result_title: 'Consistent mapping in the history'
    result_text: 'The initial view and later refreshes use the same processing. A contact can be matched while the original value from the phone system remains visible.'
    detail1_title: '1. Prefer precise matches'
    detail1_text: 'Lookup checks exact numbers first, then canonical formats, then legacy aliases. Country codes are retained. Ambiguous legacy fallback matches are not automatically assigned to a contact.'
    detail2_title: '2. Use the right contact context'
    detail2_text: 'Call history is loaded for the signed-in user’s extension. Contact matching considers personal, global and accessible department contacts.'
    detail3_title: '3. Refresh without changing meaning'
    detail3_text: 'History refreshes periodically, with overlapping refresh requests prevented. Filters distinguish incoming, outgoing and missed calls. An unanswered outgoing call is not treated as a missed incoming call.'
    tech: 'Symfony · Doctrine DBAL · Twig · Stimulus · Phone-number matching · Phone-system integration'
    example_title: 'The same number, three purposes'
