intranet_capacity:
    title: 'Kapazitätsplanung: Intranet-Fallstudie'
    label: 'Intranet / Kapazitätsplanung'
    heading: 'Projektstunden brauchen eine Vergleichsgröße.'
    intro: 'Die Kapazitätsplanung stellt geplante Projektstunden den verfügbaren Stunden je Arbeitsgruppe und Kalenderwoche gegenüber. Kalenderregeln und die für diese Woche gültigen Kapazitätszuordnungen fließen in die Berechnung ein. Webansicht und Excel-Export nutzen denselben Berechnungsdienst.'
    problem_title: 'Stunden allein zeigen keine Auslastung'
    problem_text: 'Die gleiche Stundenplanung kann in zwei Wochen unterschiedlich zu bewerten sein. Verfügbare Arbeitszeit und Kalenderregeln verändern die Grundlage für den Vergleich.'
    decision_title: 'Pro Gruppe und Woche rechnen'
    decision_text: 'Geplante Last und verfügbare Kapazität werden gemeinsam berechnet. Wenn keine Kapazitätsgrundlage konfiguriert ist, bleibt das als eigener Zustand sichtbar.'
    result_title: 'Fehlende Daten bleiben erkennbar'
    result_text: 'Die Übersicht zeigt das Verhältnis zwischen Planung und Kapazität. Eine fehlende Berechnungsgrundlage wird nicht als Überlast ausgegeben. Webansicht und Export greifen auf dieselben Regeln zurück.'
    detail1_title: '1. Den Kalender mitrechnen'
    detail1_text: 'Die Wochenkapazität berücksichtigt Arbeitszeit, Mitarbeiterzahl, einen konfigurierten Abwesenheitsfaktor sowie Tages- und Brückentagsfaktoren. Verwendet werden die Kapazitätszuordnungen, die in der jeweiligen Woche gültig sind.'
    detail2_title: '2. Unbekannt ist ein eigener Zustand'
    detail2_text: 'Sind alle konfigurierten Kapazitäten null, liefert die Berechnung keine Auslastungsklasse. Die Oberfläche kennzeichnet die fehlende Grundlage grau. Warnstufen richten sich nach konfigurierten Kapazitätsgrenzen; 110 Prozent sind deshalb nicht automatisch eine bestimmte Warnklasse.'
    detail3_title: '3. Dieselben Regeln für Ansicht und Export'
    detail3_text: 'Der JSON-Endpunkt für die Wochenübersicht und der Excel-Export verwenden denselben Kapazitätsdienst. Nach einer Planänderung lädt die Oberfläche gezielt die betroffenen Gruppen und Wochen neu; bei Bedarf ist ein vollständiges Nachladen vorgesehen.'
    tech: 'Symfony · Doctrine DBAL · SQL Server · Stimulus · PhpSpreadsheet'
    example_title: 'Drei Beispielwochen einer Arbeitsgruppe'
