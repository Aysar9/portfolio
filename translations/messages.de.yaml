projekt_intranet:
    title: 'Internes Intranet-Portal – Case Study'
    back: '← Zurück zu Projekte'
    label: 'Case Study'
    heading: 'Internes Intranet-Portal für einen Fertigungsbetrieb'
    intro: 'Eine zentrale, webbasierte Plattform, die zahlreiche betriebliche Abläufe eines mittelständischen Industrieunternehmens bündelt – von der ERP-Auswertung über Personal- und Kapazitätsplanung bis hin zu Drucker-, Fuhrpark- und Zeugnisverwaltung. Ich habe die Anwendung eigenständig konzipiert, entwickelt und betreibe sie produktiv.'
    techstack_heading: 'Tech-Stack'
    tech_backend: '<strong>Backend:</strong> PHP 8.2+, Symfony 7.4 (Security, Messenger, Scheduler, Notifier, LDAP, Mailer)'
    tech_frontend: '<strong>Frontend:</strong> Twig, Tailwind CSS, Symfony UX / Stimulus (Turbo, Chart.js) – rund 60 Stimulus-Controller'
    tech_data: '<strong>Datenzugriff:</strong> Doctrine DBAL mit mehreren parallelen Verbindungen zu Bestandssystemen'
    tech_auth: '<strong>Authentifizierung:</strong> Active Directory / LDAP (eigener User-Provider, SSO)'
    tech_async: '<strong>Async:</strong> Symfony Messenger + Redis + Scheduler'
    tech_docs: '<strong>Dokumente:</strong> mPDF, TCPDF, FPDI, Browsershot (PDF); PhpSpreadsheet (Excel)'
    challenges_heading: 'Herausforderungen & Lösungen'
    challenge1_title: '1. Anbindung mehrerer gewachsener Datenbanken'
    challenge1_text: 'Die Daten lagen in verschiedenen Bestandssystemen (u. a. einem ERP). Statt eines klassischen ORM-Modells setze ich gezielt auf Doctrine DBAL mit mehreren Verbindungen und handoptimierten SQL-Abfragen – so lassen sich Fremdsysteme lesend auswerten, ohne deren Schemata zu gefährden.'
    challenge2_title: '2. Zentrale Authentifizierung über das Firmen-AD'
    challenge2_text: 'Anwender sollen sich nicht erneut registrieren. Ich habe einen eigenen LDAP-User-Provider gebaut, der gegen das Active Directory authentifiziert und Rollen ausliest. Darauf setzt ein modulares Berechtigungssystem auf, das jedes Funktionsmodul einzeln freischaltet.'
    challenge3_title: '3. Lang laufende Aufgaben blockieren die UI nicht'
    challenge3_text: 'Große Excel-Exporte, Drucker-Status-Abfragen, automatische Warn-Mails und Aufräum-Jobs laufen asynchron über Symfony Messenger (Redis) und werden teils über den Scheduler zeitgesteuert. Die Oberfläche bleibt reaktionsschnell.'
    challenge4_title: '4. Dokumentengenerierung in vielen Formaten'
    challenge4_text: 'Etiketten, Zeugnisse und Auswertungen müssen druckfertig erzeugt werden. Ich kombiniere mehrere PDF-Engines je nach Anforderung und liefere ERP-Auswertungen zusätzlich als Excel aus.'
    role_heading: 'Meine Rolle'
    role_text: 'Ich bin alleiniger Entwickler und Maintainer: Architektur, Backend, Frontend, Datenbank-Anbindung, Deployment und laufender Betrieb liegen vollständig bei mir. Die Anwendung wird produktiv genutzt und kontinuierlich um neue Module erweitert.'
    result_heading: 'Ergebnis'
    result_text: 'Eine produktiv eingesetzte Plattform mit über 25 fachlichen Modulen. Verstreute manuelle Abläufe und Insellösungen wurden durch einen zentralen, AD-integrierten Zugangspunkt ersetzt – wartbar, erweiterbar und auf einem modernen Symfony-Stack aufgebaut.'

