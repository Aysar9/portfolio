intranet_telephone:
    title: 'Telefonbuch & Anrufverlauf: Intranet-Fallstudie'
    label: 'Intranet / Telefonie'
    heading: 'Telefonbuch und Telefonanlage verbinden.'
    intro: 'Das Telefonmodul verbindet ein gemeinsames Telefonbuch mit dem Anrufverlauf der Telefonanlage. Es ordnet unterschiedliche Rufnummernformate Kontakten zu. Originalnummer, Telefonbuchwert und Rückrufformat bleiben dabei getrennt.'
    problem_title: 'Eine Nummer, mehrere Formate'
    problem_text: 'Die Telefonanlage und das Telefonbuch stellen dieselbe Rufnummer unterschiedlich dar. Ein einziges umgewandeltes Format eignet sich nicht gleichermaßen für Anzeige, Kontaktzuordnung und Rückruf.'
    decision_title: 'Jeder Wert hat eine Aufgabe'
    decision_text: 'Der Originalwert bleibt erhalten. Ein eigener Matcher erzeugt passende Werte für Telefonbuch und Rückruf und bevorzugt genaue Treffer vor älteren Zuordnungsregeln.'
    result_title: 'Einheitliche Zuordnung im Verlauf'
    result_text: 'Die erste Ansicht und spätere Aktualisierungen verwenden dieselbe Aufbereitung. Ein Kontakt kann zugeordnet werden, während der ursprüngliche Wert der Telefonanlage weiterhin angezeigt wird.'
    detail1_title: '1. Präzise Treffer zuerst'
    detail1_text: 'Die Suche prüft zuerst exakte, dann vereinheitlichte Rufnummern und zuletzt ältere Alias-Regeln. Ländervorwahlen bleiben erhalten. Mehrdeutige Treffer im Legacy-Fallback werden nicht automatisch einem Kontakt zugeordnet.'
    detail2_title: '2. Kontakte im passenden Benutzerkontext'
    detail2_text: 'Der Anrufverlauf wird für die Nebenstelle des angemeldeten Benutzers geladen. Für die Kontaktzuordnung werden persönliche, globale und freigegebene Abteilungskontakte berücksichtigt.'
    detail3_title: '3. Aktualisieren, ohne die Bedeutung zu ändern'
    detail3_text: 'Der Verlauf wird regelmäßig nachgeladen; gleichzeitig laufende Aktualisierungen werden vermieden. Filter unterscheiden eingehende, ausgehende und verpasste Anrufe. Ein unbeantworteter ausgehender Anruf wird dabei nicht als verpasster Eingang behandelt.'
    tech: 'Symfony · Doctrine DBAL · Twig · Stimulus · Rufnummern-Matcher · Telefonanlagen-Anbindung'
