projekt_intranet:
    title: 'Internes Intranet-Portal: Case Study'
    back: '← Zurück zu Projekte'
    label: 'Case Study'
    heading: 'Fertigungsstatus erfassen. Wiederholungen sicher behandeln.'
    intro: 'Das Fertigungsmodul verwaltet Projekte, Zeichnungsrevisionen und einzelne Rohrspools, also vorgefertigte Rohrbaugruppen. ERP-Projektdaten ergänzen die Ansicht. Statusbuchungen und Verlauf liegen in der eigenen Intranet-Datenbank.'
    techstack_heading: 'Tech-Stack'
    tech_backend: '<strong>Backend:</strong> PHP 8.2+, Symfony 7.4 (Security, Messenger, Scheduler, Notifier, LDAP, Mailer)'
    tech_frontend: '<strong>Frontend:</strong> Twig, Tailwind CSS, Symfony UX / Stimulus, Turbo und Chart.js'
    tech_data: '<strong>Datenzugriff:</strong> Doctrine DBAL, SQL Server und getrennte Verbindungen für ERP- und Intranet-Daten'
    tech_auth: '<strong>Zugriff:</strong> Webserver-/LDAP-Anmeldung, mobile API mit Entra-Bearer-Token und rollenbasierten Rechten'
    tech_async: '<strong>Async:</strong> Symfony Messenger + Redis + Scheduler'
    tech_docs: '<strong>Dokumente:</strong> mPDF, TCPDF, FPDI, Browsershot (PDF); PhpSpreadsheet (Excel)'
    challenges_heading: 'Herausforderungen & Lösungen'
    challenge1_title: '1. ERP-Daten lesen, Fertigungsdaten schreiben'
    challenge1_text: 'Projektinformationen werden aus dem ERP gelesen. Neue Statusbuchungen schreibt das Fertigungsmodul mit Doctrine DBAL in eigene Tabellen. Diese unterschiedlichen Aufgaben laufen über getrennte Datenbankverbindungen.'
    challenge2_title: '2. Berechtigung und Zeichnungsstand prüfen'
    challenge2_text: 'Eine mobile Buchung benötigt Schreibrechte und die Freigabe für die gewählte Fertigungsstufe. Die API weist neue Buchungen für Spools zurück, die nicht mehr zur aktiven Revision gehören.'
    challenge3_title: '3. Lang laufende Aufgaben blockieren die UI nicht'
    challenge3_text: 'Große Excel-Exporte, Drucker-Status-Abfragen, automatische Warn-Mails und Aufräum-Jobs laufen asynchron über Symfony Messenger (Redis) und werden teils über den Scheduler zeitgesteuert. Die Oberfläche bleibt reaktionsschnell.'
    challenge4_title: '3. Nachträge dürfen den Fortschritt nicht zurücksetzen'
    challenge4_text: 'Für den aktuellen Status zählt die höchste gebuchte Fertigungsstufe seit dem letzten Reset. Wird eine frühere Stufe nachgetragen, fällt der Fortschritt nicht zurück. Stornierte Buchungen bleiben im Verlauf erhalten, zählen aber nicht mehr für den aktiven Status.'
    revision_title: '4. Bauteilidentität über Revisionen erhalten'
    revision_text: 'Unveränderte Bauteile können aus einer abgelösten Zeichnungsrevision in die aktive Revision übernommen werden. Dabei bleibt die ursprüngliche Bauteil-ID erhalten, auf die Statushistorie, QR-Etiketten und Verpackung verweisen. Prüfungen verhindern das Ersetzen bereits gebuchter oder aktiv verpackter Zielpositionen.'
    role_heading: 'Meine Rolle'
    role_text: 'Mein Beitrag umfasst Architektur, Symfony-Backend, Twig-Frontend, Datenbank-Anbindung und Server-Betrieb. Dazu gehört auch, die fachlichen Anforderungen in wartbare Module zu übersetzen.'
    result_heading: 'Ergebnis'
    result_text: 'Projektübersicht, Statusverlauf und Fortschrittsberechnung greifen auf gemeinsame Fertigungsdaten und Statusregeln zu. Das verbindet die Erfassung in der Werkstatt mit einer nachvollziehbaren Übersicht im Intranet.'

