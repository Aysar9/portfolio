about:
    title: 'Über mich – Aysar Alatrash'
    label: 'Über mich'
    heading: 'Vom Quereinstieg zum Full-Stack Entwickler'
    p1: 'Nach einer IHK-Umschulung zum Fachinformatiker für Anwendungsentwicklung arbeite ich heute als Entwickler bei der Butting GmbH in Schwedt, wo ich eine interne Intranet-Plattform eigenständig entwickle und betreue.'
    p2: 'Mein Schwerpunkt liegt auf PHP und Symfony – von der Datenbankmodellierung über die Backend-Logik bis zum Frontend mit Twig und Tailwind CSS. Auch der Betrieb auf Ubuntu-Servern mit Nginx gehört zu meinem Alltag.'
    p3: 'Ich arbeite strukturiert, dokumentiere meine Lösungen und lerne kontinuierlich dazu. Aktuell vertiefe ich meine Kenntnisse in Docker, CI/CD und der Integration von KI-Funktionen in Web-Anwendungen.'
    cv_download: 'Lebenslauf herunterladen (PDF)'

