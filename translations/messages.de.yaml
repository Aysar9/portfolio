projekt_jobtrack:
    evidence_label: 'Eine Business-Regel im Detail'
    evidence_heading: 'Ein Statuswechsel ist mehr als ein Feld-Update.'
    evidence_from: 'Beworben'
    evidence_to: 'Angenommen'
    evidence_rejected: 'Der direkte Wechsel von „beworben“ zu „angenommen“ ist nicht erlaubt.'
    evidence_note: 'Die Regel liegt im Domänen-Code. Unit-Tests prüfen die Statuslogik, funktionale Tests die HTTP-Endpunkte.'
    title: 'JobTrack API: Case Study'
    back: '← Zurück zu Projekte'
    label: 'Case Study'
    heading: 'REST-API zur Verwaltung von Bewerbungen'
    intro: 'Eine REST-API, die den Status eigener Bewerbungen durchgängig abbildet, von „beworben" bis „angenommen". Bewusst als Übungsprojekt während der Jobsuche gebaut, um API-Design, Containerisierung und automatisierte Tests praxisnah zu vertiefen.'
    techstack_heading: 'Tech-Stack'
    tech_backend: '<strong>Backend:</strong> PHP 8.3, Symfony 7, Doctrine ORM'
    tech_data: '<strong>Datenbank:</strong> MySQL 8'
    tech_infra: '<strong>Infrastruktur:</strong> Docker &amp; Docker Compose (Nginx, PHP-FPM, MySQL als getrennte Container)'
    tech_tests: '<strong>Tests:</strong> PHPUnit, Unit- und funktionale Tests (15 Tests)'
    challenges_heading: 'Herausforderungen & Lösungen'
    challenge1_title: '1. Gültige Status-Übergänge erzwingen'
    challenge1_text: 'Eine Bewerbung darf nicht von jedem Status in jeden anderen wechseln (z. B. nicht direkt von „beworben" zu „angenommen"). Die Übergangslogik sitzt als eigene Business-Regel im Domänen-Code statt verstreut im Controller, mit einem dedizierten PATCH-Endpunkt für Statuswechsel.'
    challenge2_title: '2. Sauberes REST-Design statt roher CRUD-Endpunkte'
    challenge2_text: 'Endpunkte liefern konsistente HTTP-Statuscodes (200, 201, 204, 404, 422) und strukturierte Validierungsfehler, damit ein Client zuverlässig zwischen „ungültige Eingabe" und „nicht gefunden" unterscheiden kann.'
    challenge3_title: '3. Von Anfang an testgetrieben'
    challenge3_text: '15 Tests decken sowohl die Statuslogik auf Unit-Ebene als auch die HTTP-Endpunkte funktional ab. Dabei habe ich bewusst geübt, Tests parallel zur Funktionalität zu schreiben statt nachträglich.'
    challenge4_title: '4. Reproduzierbare Umgebung mit Docker'
    challenge4_text: 'Nginx, PHP-FPM und MySQL laufen als getrennte Container über Docker Compose. Ein „docker compose up -d --build" plus Migration reicht, um die Anwendung überall identisch zum Laufen zu bringen.'
    role_heading: 'Meine Rolle'
    role_text: 'Alleiniger Entwickler: API-Design, Domänenlogik, Datenbank-Modellierung, Tests und Docker-Setup stammen vollständig von mir. Das Projekt dient mir als gezielte Übung für Backend- und DevOps-Praxis.'
    result_heading: 'Ergebnis'
    result_text: 'Eine funktionierende, vollständig containerisierte REST-API mit sauberem Status-Lifecycle, konsistenten HTTP-Antworten und 15 bestehenden Tests. Ein kompakter Nachweis für API-Design, Testdisziplin und Docker-Kenntnisse.'
    repo_link: 'Code auf GitHub ansehen'

projekt_aitext:
    title: 'AI-Text-Zusammenfasser: Case Study'
    back: '← Zurück zu Projekte'
    label: 'Case Study'
    heading: 'Mein erster KI-Agent in PHP, gebaut mit Symfony AI'
    intro: 'Eine kleine Symfony-Anwendung, um Symfonys brandneue offizielle AI-Komponente praktisch kennenzulernen: Ein Agent fasst beliebige Texte über die OpenAI-API (gpt-4o-mini) in drei Sätzen zusammen. Entstanden als Begleitcode zu einem deutschsprachigen Tutorial, das ich aufgenommen habe. Es ist ein kompaktes, ehrliches Demo statt einer Produktivanwendung, bei dem das neue AgentInterface end-to-end verdrahtet ist.'
    techstack_heading: 'Tech-Stack'
    tech_backend: '<strong>Backend:</strong> PHP 8.4, Symfony 8.1'
    tech_ai: '<strong>KI:</strong> Symfony AI Bundle v0.11.0 (ai-bundle, ai-agent, ai-open-ai-platform) mit OpenAI gpt-4o-mini'
    tech_frontend: '<strong>Frontend:</strong> Twig, Symfony UX Turbo'
    challenges_heading: 'Herausforderungen & Lösungen'
    challenge1_title: '1. Symfony AI ist ein Baukasten aus 70+ Paketen, nicht eines'
    challenge1_text: 'Das ai-bundle allein reicht nicht. Dazu kommen die Agent-Komponente ai-agent (Agent, MessageBag) und eine separate Anbieter-Bridge (hier: ai-open-ai-platform). Der Vorteil: Ein späterer Anbieterwechsel (Anthropic, Gemini, ein lokales Ollama-Modell) bedeutet nur das Austauschen der Bridge, nicht das Umschreiben der eigenen Anwendungslogik.'
    challenge2_title: '2. Turbo schluckt die Antwort'
    challenge2_text: 'Das Symfony-Webapp-Skeleton bringt Symfony UX Turbo mit, das nach einem Formular-POST einen Redirect erwartet. Ohne data-turbo="false" am &lt;form&gt; antwortet der Server zwar korrekt, im Browser erscheint aber nichts. Das erinnert mich daran, bei „die UI tut nichts" den Network-Tab statt nur die Server-Logs zu prüfen.'
    role_heading: 'Meine Rolle'
    role_text: 'Ich habe das Projekt allein gebaut, um Symfonys neue AI-Integrationsschicht praktisch zu lernen, bevor ich sie in einem echten Projekt einsetze. Begleitcode zu einem deutschsprachigen YouTube-Tutorial, das ich aufgenommen habe. Produktionsthemen (Formular-Validierung, CSRF, Fehlerbehandlung, Streaming) habe ich bewusst weggelassen, da sie nicht der Punkt der Übung waren.'
    result_heading: 'Ergebnis'
    result_text: 'Ein minimaler, funktionierender KI-Agent vom Formular über den Agent und OpenAI bis zu Twig, plus zwei dokumentierte Stolpersteine für den nächsten Entwickler (und mein zukünftiges Ich), der mit Symfony AI arbeitet.'
    repo_link: 'Code auf GitHub ansehen'

