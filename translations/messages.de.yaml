intranet_absence:
    title: 'Azubi-Fehlzeiten: Intranet-Fallstudie'
    label: 'Intranet / Azubi-Fehlzeiten'
    heading: 'Fehlzeiten im Ausbildungszeitraum einordnen.'
    intro: 'Das Modul bereitet vorhandene Fehlzeitendaten für eine durchsuchbare Ausbildungsübersicht auf. Die Detailansicht zeigt Monatswerte, Jahressummen und den kumulierten Verlauf. Ausbildungszeitraum und berechnete Nettoarbeitstage liefern den Kontext für die Kennzahlen.'
    problem_title: 'Eine Summe erklärt den Verlauf nicht'
    problem_text: 'Eine Gesamtzahl zeigt weder, wann Fehlzeiten erfasst wurden, noch auf welchen Abschnitt der Ausbildung sie sich bezieht. Für eine verständliche Auswertung braucht es zeitliche Details.'
    decision_title: 'Monat, Jahr und Zeitraum verbinden'
    decision_text: 'Die Daten werden nach Jahr und Monat zusammengefasst. Eine Detailansicht ergänzt die Übersicht um Monatswerte und eine kumulierte Darstellung innerhalb des Ausbildungszeitraums.'
    result_title: 'Von der Übersicht zum Verlauf'
    result_text: 'Ein ausgewähltes Profil führt zu Monatswerten, Jahressummen und dem Verlauf. So lässt sich die Gesamtsumme anhand der einzelnen Zeitabschnitte nachvollziehen.'
    detail1_title: '1. Suchen und Details nachladen'
    detail1_text: 'Die Suche filtert die Ausbildungsübersicht. Beim Auswählen eines Eintrags lädt die Oberfläche die zugehörigen JSON-Daten und öffnet eine Detailansicht, ohne die gesamte Seite neu aufzubauen.'
    detail2_title: '2. Der Zeitraum gehört zur Kennzahl'
    detail2_text: 'Monate außerhalb des Ausbildungszeitraums erscheinen als Strich; Monate innerhalb können null erfasste Fehltage zeigen. Die Quote in der Übersicht bezieht sich auf die Zeit bis heute, die Detailkennzahl auf den gesamten Ausbildungszeitraum. Diese Bezugsgrößen müssen beim Lesen unterschieden werden.'
    detail3_title: '3. Monatswerte kumulieren'
    detail3_text: 'Das Backend summiert Fehltage nach Monat, Jahr und insgesamt. Chart.js baut den kumulierten Verlauf aus chronologisch sortierten Jahr-Monat-Schlüsseln auf. Ein Monat ohne neue Fehltage lässt den kumulierten Wert unverändert.'
    tech: 'Symfony · Doctrine DBAL · SQL Server · Twig · Stimulus · Chart.js'
    example_profile: 'Beispielprofil A'
    example_period: 'August bis Oktober'
    total_days: 'erfasste Fehltage'
    monthly: 'Fehltage im Monat'
    cumulative: 'Kumuliert'
    month_values: 'Monatswerte und kumulierte Fehltage'
    august: 'Aug'
    september: 'Sep'
    october: 'Okt'
    month_days: 'Fehltage: %days%'
    running_total: 'Kumuliert: %days%'
    zero_note: 'Im September kommen keine Fehltage hinzu. Der kumulierte Wert bleibt bei zwei Tagen.'
    caption: 'Schematische Darstellung mit erfundenen Tageswerten. Alle drei Beispielmonate liegen innerhalb des Ausbildungszeitraums. Keine echten Personaldaten.'

intranet_labels:
    title: 'Etikettengenerator: Intranet-Fallstudie'
    label: 'Intranet / Etiketten'
    heading: 'Excel-Daten in Etiketten übersetzen.'
    intro: 'Der Etikettengenerator verbindet gespeicherte Layouts mit Excel-Daten. Dynamische Textfelder beziehen ihre Werte aus zugeordneten Spalten. Daraus entstehen PDF-Seiten im Etikettenformat; QR-Inhalte können aus denselben Feldern aufgebaut werden.'
    problem_title: 'Gleiches Layout, wechselnde Inhalte'
    problem_text: 'Projekt- und Positionsdaten ändern sich von Zeile zu Zeile. Das Etikettenlayout soll dabei wiederverwendbar bleiben, ohne jede Beschriftung einzeln anzulegen.'
    decision_title: 'Layout und Daten getrennt halten'
    decision_text: 'Die Vorlage speichert Komponenten, Positionen und Spaltenzuordnungen. Beim Erstellen setzt der Generator die Excel-Werte in diese Struktur ein.'
    result_title: 'Eine Serie von PDF-Etiketten'
    result_text: 'Verarbeitete Zeilen werden zu einzelnen Etikettenseiten. Ändern sich konfigurierte Gruppierungswerte in der Datenfolge, beginnt der Generator eine neue PDF-Datei.'
    detail1_title: '1. Felder statt fester Inhalte'
    detail1_text: 'Der grafische Designer ordnet dynamischen Textfeldern Excel-Spalten zu. Der Generator übersetzt Spaltenbuchstaben in Indizes und liest den Wert aus der jeweiligen Datenzeile. Das gespeicherte Layout bleibt davon getrennt.'
    detail2_title: '2. Vom Editor zum PDF-Format'
    detail2_text: 'Positionen und Größen der Komponenten werden für die Ausgabe in Millimeter umgerechnet. Text, Formen, Drehungen, Logos und QR-Komponenten haben eigene PDF-Zeichenroutinen. Pro verarbeiteter Datenzeile wird eine Seite im Etikettenformat angelegt.'
    detail3_title: '3. Dateien entlang der Datenfolge aufteilen'
    detail3_text: 'Bis zu drei konfigurierte Excel-Spalten bestimmen die Dateigrenzen. Wenn sich deren Werte beim Durchlaufen der Zeilen ändern, beginnt eine neue PDF-Datei. Entscheidend ist die Reihenfolge der Eingabedaten.'
    tech: 'Symfony · Doctrine DBAL · Twig · Stimulus · Konva · PhpSpreadsheet · TCPDF'
    mapping_heading: 'Excel-Spalten → Vorlagenfelder'
    project: 'Projekt'
    position: 'Position'
    description: 'Bezeichnung'
    part: 'Bauteil A'
    mapping_note: 'Die Vorlage bestimmt das Layout. Die Datenzeile liefert den Inhalt.'
    pdf_format: 'PDF · Etikettenformat'
    page_note: 'Eine Etikettenseite pro Datenzeile.'
    caption: 'Schematische Darstellung mit erfundenen Feldern und Werten. Keine echten Etiketten oder Kundendaten. Die Ausgabe besteht aus PDF-Seiten im Etikettenformat.'

intranet_printers:
    title: 'Druckerverwaltung: Intranet-Fallstudie'
    label: 'Intranet / Drucker'
    heading: 'Druckerzustand und Wartung zusammenbringen.'
    intro: 'Das Druckermodul verbindet gespeicherte Tonerstände und Seitenzähler mit Wartungseinträgen. Geplante Geräteabfragen liefern neue Messwerte. Eine durchsuchbare Übersicht und ein zeitlich filterbarer Verlauf machen die Werte zugänglich.'
    problem_title: 'Ein Messwert zeigt nur einen Zeitpunkt'
    problem_text: 'Der aktuelle Seitenzähler beschreibt noch keine Entwicklung. Für die Betreuung der Geräte braucht es frühere Werte und die zugehörigen Wartungseinträge.'
    decision_title: 'Abfragen und Anzeigen trennen'
    decision_text: 'Geplante Hintergrundaufgaben lesen Gerätewerte per SNMP. Verwendbare Seitenzähler werden gespeichert und in einer Historie ergänzt; die Oberfläche liest die gespeicherten Daten.'
    result_title: 'Zustand und Verlauf an einem Ort'
    result_text: 'Die Übersicht verbindet Gerätewerte mit Wartungsinformationen. Ein Datumsfilter grenzt den Zählerverlauf ein, während dokumentierte Arbeiten separat nachvollziehbar bleiben.'
    detail1_title: '1. Geräte im Hintergrund abfragen'
    detail1_text: 'Symfony Scheduler stößt die Geräteabfrage an; ein Messenger-Handler liest die SNMP-Werte und schreibt sie in die Datenbank. Die Webansicht greift auf diese gespeicherten Messwerte zu. Sie zeigt damit einen Datenstand aus geplanten Abfragen.'
    detail2_title: '2. Unbekannte Zähler nicht als null speichern'
    detail2_text: 'Geräte können neben Zahlen auch nicht verwertbare Rückgaben liefern. Die Verarbeitung prüft Seitenzähler auf numerische, nicht negative Werte. Unbekannte oder ungültige Zähler werden nicht als neue Messpunkte in die Historie geschrieben.'
    detail3_title: '3. Zählerstand und Veränderung unterscheiden'
    detail3_text: 'Für den Verlauf fasst SQL die gespeicherten Werte pro Tag mit dem höchsten Zählerstand zusammen. Die Oberfläche kann Differenzen zwischen vorhandenen Messpunkten darstellen. Bei Lücken entspricht eine solche Differenz dem Abstand zwischen den Messungen, nicht zwingend einem einzelnen Kalendertag.'
    tech: 'Symfony · Scheduler · Messenger · SNMP · Doctrine DBAL · SQL Server · Stimulus · Chart.js'
    example_device: 'Beispieldrucker A'
    counter: 'Seitenzähler'
    toner: 'Tonerfüllstand'
    stored_readings: 'Gespeicherte Tageswerte · Seitenzähler'
    day1: '21. Okt.'
    day2: '22. Okt.'
    day3: '23. Okt.'
    maintenance: 'Wartungseintrag'
    maintenance_entry: 'Rollen gereinigt'
    maintenance_note: 'Dokumentierte Arbeiten ergänzen die automatisch erfassten Gerätewerte.'
    history: 'Historie'
    caption: 'Schematische Darstellung mit erfundenen Messwerten und einem Wartungseintrag. Gezeigt werden gespeicherte Seitenzähler, keine Live-Abfrage. Keine echten Geräte- oder Netzwerkdaten.'

intranet_vehicles:
    title: 'Fahrzeugverwaltung: Intranet-Fallstudie'
    label: 'Intranet / Fahrzeuge'
    heading: 'Fahrzeugdaten und Wartung zusammenführen.'
    intro: 'Die Fahrzeugverwaltung verbindet Stammdaten mit einer chronologischen Wartungshistorie sowie UVV- und WOLKE-Einträgen. Die Detailansicht ergänzt einen HU-Termin aus einer vorhandenen Excel-Fuhrparkliste. PDF-Ausgaben machen die erfassten Arbeiten als Dokument zugänglich.'
    problem_title: 'Fahrzeugwissen liegt in mehreren Quellen'
    problem_text: 'Stammdaten und Wartungsarbeiten gehören zum Fahrzeug, während der HU-Termin in einer bestehenden Excel-Liste geführt wird. Für eine gemeinsame Ansicht müssen diese Informationen zusammenfinden.'
    decision_title: 'Über die Fahrzeug-ID verbinden'
    decision_text: 'Die Detailansicht lädt Fahrzeug und Wartungshistorie aus der Datenbank. Den HU-Termin liest sie über die passende Fahrzeug-ID aus der Excel-Liste hinzu.'
    result_title: 'Eine nachvollziehbare Fahrzeugakte'
    result_text: 'Erfasste Arbeiten erscheinen in zeitlicher Reihenfolge. UVV- und WOLKE-Einträge lassen sich wiederfinden; die Historie und einzelne Prüfeinträge können als PDF ausgegeben werden.'
    detail1_title: '1. Bestehende Excel-Daten einbeziehen'
    detail1_text: 'PhpSpreadsheet liest die vorhandene Fuhrparkliste. Der Abgleich erfolgt über die Fahrzeug-ID; aus der passenden Zeile wird der HU-Termin übernommen. Die Oberfläche führt diesen Wert mit den Daten aus der Anwendung zusammen.'
    detail2_title: '2. Arbeiten und Prüfarten gemeinsam erfassen'
    detail2_text: 'Ein Wartungseintrag enthält die Beschreibung der Arbeit und kann als UVV oder WOLKE gekennzeichnet werden. Die Historie wird nach Erfassungszeit sortiert. Die Übersicht der letzten UVV- und WOLKE-Einträge greift auf die jeweils jüngsten passenden Datensätze zurück.'
    detail3_title: '3. Aus Einträgen Dokumente erzeugen'
    detail3_text: 'PDF-Ausgaben bereiten die Wartungshistorie eines Fahrzeugs und einzelne Prüfeinträge auf. Die Dokumente verwenden die gespeicherten Angaben und verbinden sie mit den zugehörigen Fahrzeugdaten.'
