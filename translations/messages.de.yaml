projekt_portfolio:
    title: 'Entwickler-Portfolio – Case Study'
    back: '← Zurück zu Projekte'
    label: 'Case Study'
    heading: 'Zweisprachiges Entwickler-Portfolio mit eigener Server-Infrastruktur'
    intro: 'Diese Website ist mein persönliches Portfolio – vollständig eigenständig konzipiert, entwickelt, deployt und betrieben. Vom Symfony-Backend über das zweisprachige Frontend bis zum eigenen Linux-Server mit automatisiertem Deployment liegt der komplette Stack in meiner Hand.'
    techstack_heading: 'Tech-Stack'
    tech_backend: '<strong>Backend:</strong> PHP 8.2+, Symfony 7.4 (Routing, Twig, Translation, HttpClient)'
    tech_frontend: '<strong>Frontend:</strong> Twig, Tailwind CSS, AssetMapper, Stimulus – ohne Node-Build-Schritt'
    tech_i18n: '<strong>Mehrsprachigkeit:</strong> Vollständig zweisprachig (Deutsch / Englisch) über Symfony Translation und locale-basiertes Routing'
    tech_ai: '<strong>KI-Integration:</strong> Eingebauter KI-Assistent (Google Gemini), der Besucherfragen zu meinem Profil beantwortet – serverseitig, mit Rate-Limiting'
    tech_infra: '<strong>Infrastruktur:</strong> Eigener Hetzner-Linux-Server mit Nginx, MySQL und HTTPS via Let''s Encrypt'
    tech_cicd: '<strong>Deployment:</strong> Automatisches Deployment via GitHub Actions (CI/CD)'
    tech_analytics: '<strong>Analytics:</strong> Selbst gehostetes, datenschutzfreundliches Umami (cookielos) auf demselben Server'
    highlights_heading: 'Highlights'
    highlight1: 'Lighthouse-Score 100/100/100/100 (Performance, Accessibility, Best Practices, SEO).'
    highlight2: 'Vollständig zweisprachig mit sauberem locale-Routing und gepflegten Übersetzungen.'
    highlight3: 'KI-Assistent als praktischer Nachweis der KI-Integration in Web-Anwendungen.'
    highlight4: 'Push-to-Deploy: Ein Git-Push löst Build und Auslieferung automatisch aus.'
    role_heading: 'Meine Rolle'
    role_text: 'Alleiniger Entwickler und Betreiber: Design, Frontend, Backend, Server-Setup, TLS, Deployment-Pipeline und laufender Betrieb stammen vollständig von mir.'
    result_heading: 'Ergebnis'
    result_text: 'Eine schnelle, barrierearme und wartbare Website mit perfektem Lighthouse-Score, automatischem Deployment und einem KI-Assistenten – ein kompakter End-to-End-Nachweis meiner Full-Stack- und DevOps-Fähigkeiten.'
